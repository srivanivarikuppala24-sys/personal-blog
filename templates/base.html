<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        My Personal Blog
        {% endblock %}
    </title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

    <nav class="navbar">

        <div class="logo">
            My Personal Blog
        </div>

        <div class="nav-links">

            <a href="{{ url_for('home') }}">
                Home
            </a>

            <a href="{{ url_for('create_post') }}">
                Create Post
            </a>

            <a href="{{ url_for('my_posts') }}">
                My Posts
            </a>

        </div>

    </nav>


    <main class="container">

        {% block content %}
        {% endblock %}

    </main>


    <footer>

        <p>
            © 2026 My Personal Blog
        </p>

    </footer>

</body>

</html>
