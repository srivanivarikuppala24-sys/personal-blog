{% extends "base.html" %}

{% block title %}
Edit Post
{% endblock %}


{% block content %}

<div class="form-container">

    <h1>
        Edit Blog Post
    </h1>


    <form method="POST">

        <label for="title">
            Blog Title
        </label>


        <input
            type="text"
            id="title"
            name="title"
            value="{{ post['title'] }}"
            required
        >


        <label for="content">
            Blog Content
        </label>


        <textarea
            id="content"
            name="content"
            rows="12"
            required
        >{{ post["content"] }}</textarea>


        <button type="submit">
            Update Post
        </button>

    </form>

</div>

{% endblock %}
